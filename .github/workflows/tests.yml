name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test resolutions
        run: python -B tests/test_resolutions.py
      - name: Test sampler settings
        run: python -B tests/test_settings.py
